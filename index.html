<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS EXTERNO -->
    <link rel="stylesheet" href="./src/css/estilo.css">
    <title>Projeto Loja</title>
</head>
<body>
    <header>
        <p class="logo">Loja<span>Game</span></p>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
        <div class="carrinho">
            <span id="carrinho-item">Items:0</span>
        </div>
    </header>
    <main id="container">
        <h2>Produtos em Destaques</h2>
        <section class="card">
            <div class="card-game">
                <img src="./src/assets/controle.jpg" alt="Controle PS4">
                <article class="card-content">
                    <h3>Controle PS4</h3>
                    <p class="preco">R$ 300,00</p>
                    <button class="btn-comprar">Comprar</button>  
                </article>
            <div class="card-game">
                <img src="./src/assets/fone.jpg" alt="Fone gamer">
                <article class="card-content">
                    <h3>Fone gamer</h3>
                    <p class="preco">R$ 89,99</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>

            <div class="card-game">
                <img src="./src/assets/teclado.jpg" alt="Teclado gamer">
                <article class="card-content">
                    <h3>Teclado gamer</h3>
                    <p class="preco">R$ 197,98</p>
                    <button class="btn-comprar">Comprar</button> 
                </article>
            </div>

            <div class="card-game">
                <img src="./src/assets/mouse.jpg" alt="Mouse gamer">
                <article class="card-content">
                    <h3>Mouse gamer</h3>
                    <p class="preco">R$ 105,99</p>
                    <button class="btn-comprar">Comprar</button> 
                </article>
            </div>

            <div class="card-game">
                <img src="./src/assets/cadeira_gamer.jpg" alt="Cadeira gamer">
                <article class="card-content">
                    <h3>Cadeira gamer</h3>
                    <p class="preco">R$ 475,90</p>
                    <button class="btn-comprar">Comprar</button> 
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy-2026 Direitos Reservados</p>
    </footer>
    
</body>
</html>
